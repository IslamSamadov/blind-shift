<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind Shift</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="red-dimension">
  <main>
    <h1>Blind Shift</h1>
    <div class="game-container">
      <p id="hud" class="hud hidden">Cubes: 0 / 0</p>
      <canvas id="game" width="480" height="352"></canvas>

      <div id="start-screen" class="screen">
        <h2>Blind Shift</h2>
        <p class="screen-text">Collect all quantum cubes to unlock the exit.<br>Avoid the stalker. Press Space to shift.</p>
        <button id="start-btn" class="screen-btn" type="button">Start Game</button>
        <p class="screen-hint">or press Enter</p>
      </div>

      <div id="game-over-screen" class="screen hidden">
        <h2 id="game-over-title">Game Over</h2>
        <p id="game-over-message" class="screen-text"></p>
        <button id="restart-btn" class="screen-btn" type="button">Play Again</button>
        <p class="screen-hint">or press Enter</p>
      </div>
    </div>
    <p class="hint">WASD or Arrow keys to move · Spacebar to shift dimension</p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
